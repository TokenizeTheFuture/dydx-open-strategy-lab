name: tests

on:
  push:
    branches: ["main", "v0.*"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Run reviewer demo
        run: |
          osl-grant-demo --output-dir artifacts/ci-grant-demo
          test -f artifacts/ci-grant-demo/summary.json
          test -f artifacts/ci-grant-demo/walk_forward_folds.csv
          test -f artifacts/ci-grant-demo/paper_fills.csv
      - name: Upload reviewer demo artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: grant-review-demo
          path: artifacts/ci-grant-demo
